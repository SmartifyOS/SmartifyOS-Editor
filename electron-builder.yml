# Packaging for every platform the CLI supports. `bun run dist` builds for the computer it
# runs on, release.yml builds all of them on GitHub.
appId: com.smartify-os.editor
productName: SmartifyOS Editor
copyright: Copyright © SmartifyOS contributors
artifactName: smartify-os-editor-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json
  - resources/icon.png
  - resources/icon-macos.png
  - '!**/*.map'

# koffi loads a native binary at runtime, which can not be read from inside the asar.
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**

# Where the editor looks for its own updates (electron-updater, see electron/updates.ts).
# Nothing is published from here (release.yml runs it with --publish never), but this is
# what makes it write the update files (latest*.yml, *.blockmap) that release.yml uploads.
publish:
  provider: github
  owner: SmartifyOS
  repo: SmartifyOS-Editor

mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  # The live preview moves the app's window with the Accessibility API, which needs the
  # app to be signed with the same identity across updates for the permission to stick.
  hardenedRuntime: true

win:
  target:
    - target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Development
  synopsis: Build your car's SmartifyOS with a live preview
  maintainer: SmartifyOS contributors

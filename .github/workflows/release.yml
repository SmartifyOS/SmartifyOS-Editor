name: Release

# Started by `bun run release` (scripts/release.ts), which pushes a `v*` tag carrying the
# release notes. Run by hand, it only builds the installers, to try them, and publishes
# nothing.
#
# The installers are built on each system and architecture, since koffi (which the live
# preview uses to reach the window system) only installs the native part for the machine
# it is installed on. Every build runs on a machine of its own target.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.14'

jobs:
  # The tag and package.json have to agree, or the installers would carry another version
  # than the release they are in. Cheaper to catch here than after building six of them.
  check-version:
    name: Check the version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: |
          PKG="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: check-version
    # Also when check-version was skipped, on a run by hand.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, runner: macos-latest }
          - { name: macOS Intel, runner: macos-15-intel }
          - { name: Windows x64, runner: windows-latest }
          - { name: Windows ARM64, runner: windows-11-arm }
          - { name: Linux x64, runner: ubuntu-latest }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run build

      # Signed with the Developer ID certificate and notarized by Apple, so it opens without
      # a warning (and keeps its Accessibility permission across updates). electron-builder
      # does both when these are set. Without the secrets it builds unsigned, as before.
      - name: Package for macOS
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No MAC_CERTIFICATE secret, building an unsigned app."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          bunx electron-builder --publish never

      # Windows is not signed (SmartScreen's "More info, Run anyway" is a small step), and
      # Linux needs no signing.
      - name: Package
        if: runner.os != 'macOS'
        run: bunx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runner }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The notes are the tag's message, written by scripts/release.ts. Fetched again on
      # purpose, since checkout can leave an annotated tag without its message.
      - name: Read the release notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag --list --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      # Each build in a folder of its own: two of them write a latest-mac.yml, two a
      # latest.yml, and those have to be merged rather than overwrite each other.
      - uses: actions/download-artifact@v7
        with:
          path: downloaded

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The update files tell the editors already installed where their update is
      # (electron/updates.ts), so they go out with every release.
      - name: Collect the files
        run: |
          set -eu
          mkdir -p artifacts
          find downloaded -type f ! -name 'latest*.yml' -exec mv {} artifacts/ \;
          bun scripts/merge-update-info.ts downloaded artifacts
          ls -la artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag made by hand has no notes, GitHub's own list then stands in for them.
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" "${notes[@]}"

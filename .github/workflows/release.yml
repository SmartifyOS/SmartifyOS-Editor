name: Release

# Builds the installers on each system and architecture, since koffi (which the live
# preview uses to reach the window system) only installs the native part for the machine
# it is installed on. Every build runs on a machine of its own target.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.14'

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, runner: macos-latest }
          - { name: macOS Intel, runner: macos-15-intel }
          - { name: Windows x64, runner: windows-latest }
          - { name: Windows ARM64, runner: windows-11-arm }
          - { name: Linux x64, runner: ubuntu-latest }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run build

      # Signing and notarizing need certificates in the repo's secrets, which are not set
      # up yet. Unsigned builds work, but macOS and Windows warn before opening them.
      - run: bunx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
